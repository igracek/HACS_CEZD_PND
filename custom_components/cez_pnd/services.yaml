fetch_data:
  name: Stáhnout data z PND
  description: Spustí okamžité stažení dat z Portálu Naměřených Dat ČEZ Distribuce. Tuto službu mohou volat pouze administrátoři Home Assistantu.
  fields:
    ean:
      name: EAN kód
      description: Specifický EAN pro stažení (nepovinné při existenci jediného odběrného místa).
      required: false
      example: "859182400123456789"
      selector:
        text:
    date_range:
      name: Období
      description: Volitelný rozsah datumů pro zpětné stažení (formát DD.MM.YYYY - DD.MM.YYYY).
      required: false
      example: "01.08.2026 - 15.08.2026"
      selector:
        text:

test_export_scenarios:
  name: Otestovat scénáře exportu PND
  description: Bez zápisu do statistik prověří bezpečné varianty identifikace exportu. Vrací pouze stavové kódy bez EAN, ELM a přihlašovacích údajů. Tuto službu mohou volat pouze administrátoři.
  fields:
    ean:
      name: EAN kód
      description: Výběr konfigurace při více odběrných místech. Do výsledku ani logu se nezapisuje v otevřeném tvaru.
      required: false
      example: "859182400123456789"
      selector:
        text:
