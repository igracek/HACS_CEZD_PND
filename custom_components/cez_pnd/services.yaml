fetch_data:
  name: Stáhnout data z PND
  description: Spustí okamžité stažení dat z Portálu Naměřených Dat ČEZ Distribuce. Tuto službu mohou volat pouze administrátoři Home Assistantu.
  fields:
    ean:
      name: EAN kód
      description: Specifický EAN pro stažení (nepovinné při existenci jediného odběrného místa).
      required: false
      example: "859182400123456789"
      selector:
        text:
    start_date:
      name: Datum od
      description: První den pro zpětné stažení. Pro běžné načtení včerejška nechte obě data prázdná.
      required: false
      selector:
        date:
    end_date:
      name: Datum do
      description: Poslední den pro zpětné stažení (včetně); maximální rozsah je 60 dní.
      required: false
      selector:
        date:

test_export_scenarios:
  name: Otestovat scénáře exportu PND
  description: Bez zápisu do statistik prověří bezpečné varianty identifikace exportu. Vrací pouze stavové kódy bez EAN, ELM a přihlašovacích údajů. Tuto službu mohou volat pouze administrátoři.
  fields:
    ean:
      name: EAN kód
      description: Výběr konfigurace při více odběrných místech. Do výsledku ani logu se nezapisuje v otevřeném tvaru.
      required: false
      example: "859182400123456789"
      selector:
        text:

recalculate_costs:
  name: Přepočítat náklady VT/NT
  description: Z uložených statistik spotřeby vytvoří nebo opraví náklady podle cenového kalendáře. Ve výchozím stavu provede pouze bezpečný náhled. Pouze pro správce.
  fields:
    ean:
      name: EAN kód
      description: Výběr konfigurace při více odběrných místech.
      required: false
      selector:
        text:
    start_date:
      name: Datum od
      required: true
      selector:
        date:
    end_date:
      name: Datum do
      required: true
      selector:
        date:
    dry_run:
      name: Pouze náhled
      description: Pokud je zapnuto, nic se nezapíše a akce vrátí počet nalezených hodin.
      required: true
      default: true
      selector:
        boolean:

rebuild_total_costs:
  name: Doplnit celkové náklady
  description: Ze stávajících hodinových nákladů VT a NT vytvoří samostatnou statistiku celkových nákladů. Hodiny bez obou tarifních záznamů odmítne. Výchozí režim je pouze náhled bez zápisu. Pouze pro správce.
  fields:
    ean:
      name: EAN kód
      description: Výběr konfigurace při více odběrných místech.
      required: false
      selector:
        text:
    start_date:
      name: Datum od
      required: true
      selector:
        date:
    end_date:
      name: Datum do
      required: true
      selector:
        date:
    dry_run:
      name: Pouze náhled
      description: Pokud je zapnuto, nic se nezapíše a akce vrátí počet spárovaných hodin a součet nákladů.
      required: true
      default: true
      selector:
        boolean:
