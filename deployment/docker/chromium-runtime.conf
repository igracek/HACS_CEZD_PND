# Chromium runtime configuration for CEZ PND integration in containerized environments (SEC10-03)
#
# POLICY: All Chromium sandbox layers (setuid sandbox, seccomp-filter sandbox, user namespaces)
# MUST remain enabled for least-privilege containment of untrusted portal web content.
#
# Disallowed flags:
#   --no-sandbox
#   --disable-seccomp-filter-sandbox
#   --disable-setuid-sandbox
#
# Clean runtime flags for Alpine/Debian Docker containers:
CHROMIUM_FLAGS=""
